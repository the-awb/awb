<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWB Toolkit</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="appBar">
      <span class="mark"></span>
      <h1>AWB Toolkit</h1>
      <span class="tagline">Open tools and keep track of their desktop sessions.</span>
    </header>
    <main>
      <section>
        <h2>SuperCollider host</h2>
        <div id="host" class="host-facts"></div>
        <div id="host-actions" class="host-actions"></div>
        <p id="host-message"></p>
      </section>
      <section>
        <div class="sectionHead"><h2>Tools</h2><span class="count" id="tools-count"></span></div>
        <div id="tools" class="grid"></div>
      </section>
      <section>
        <div class="sectionHead"><h2>Active views</h2><span class="count" id="views-count"></span></div>
        <div id="views" class="grid"></div>
      </section>
      <section id="failures-section" hidden>
        <h2>Unavailable tools</h2>
        <div id="failures"></div>
      </section>
    </main>
    <script src="icons.js"></script>
    <script src="home.js"></script>
  </body>
</html>
