<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live scope</title><link rel="stylesheet" href="/scope.css"></head>
<body><main><header><div><span class="eyebrow">SUPER COLLIDER / LIVE SCOPE</span><h1 id="title">Live scope</h1><p id="routing"></p></div><span id="connection">Connecting</span></header>
<section class="scope-display"><canvas id="scope" aria-label="Live audio samples"></canvas><div class="scope-ruler"><span id="channels">—</span><span id="duration">—</span></div></section>
<div id="signalPicker" class="signal-picker" hidden><label>Signals<select id="signals"><option value="all">All six channels</option><option value="noise">Noise array · 1 / 5 / 20 / 100 Hz</option><option value="slow">Sine LFO · 1 Hz</option><option value="fast">Sine LFO · 10 Hz</option></select></label></div>
<div class="scope-controls"><button id="freeze">Freeze</button><label class="zoom-control">Y zoom<input id="gain" type="range" data-scale="log2" min="-4" max="6" step="0.01" value="0" aria-label="Y zoom" title="Double-click to reset to 1×"><output id="gainValue" for="gain" aria-live="off">1×</output></label><label class="zoom-control">X zoom<input id="zoom" type="range" data-scale="log2" min="-4" max="3" step="0.01" value="0" aria-label="X zoom" title="Double-click to reset to 1×"><output id="zoomValue" for="zoom" aria-live="off">1×</output></label><span id="level">—</span></div>
<div class="scope-navigation"><span id="startTime">0 ms</span><label for="pan">Position<input id="pan" type="range" min="0" max="100" step="0.1" value="0" disabled aria-label="Position within captured samples"></label><span id="endTime">—</span></div>
<div class="paint-rate"><label>Trace<select id="traceMode" aria-label="Trace connections" title="Connections between measured samples; reduced audio retains its min/max envelope"><option value="connected">Connected</option><option value="stepped">Stepped</option></select></label><label>Refresh<select id="paintRate"><option value="0">Auto</option><option value="30">30 fps</option><option value="15">15 fps</option></select></label></div>
<p id="resolution" class="scope-resolution">Waiting for capture</p><footer><span id="source">—</span><span id="updates">Waiting for SC</span></footer></main><script type="module" src="/scope.js"></script></body></html>
