<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SC DSP history</title><link rel="stylesheet" href="/style.css">
<body><header><div><h1>SC DSP HISTORY</h1><span id="status">Waiting for server</span></div><form id="connection"><label>Server OSC port <input id="port" type="number" min="1" max="65535" value="57110"></label><button>Connect</button></form></header>
<section class="readings"><div><span>AVERAGE</span><strong id="average">—</strong></div><div><span>REPORTED PEAK</span><strong id="peak">—</strong></div><div><span>MAX SINCE CLEAR</span><strong id="maximum">—</strong><small id="max-time"></small></div><div><span>AUDIO</span><strong id="rate">—</strong><small id="nodes"></small></div></section>
<main><canvas id="plot" aria-label="Five-minute average and reported peak SuperCollider DSP load history"></canvas><div id="inspect">Hover to inspect a sample</div></main>
<footer><span><i class="average"></i> Average <i class="peak"></i> Peak · five minutes</span><div><button id="freeze">Freeze</button><button id="clear">Clear</button><button id="export">Export CSV</button></div></footer>
<p class="note">SC DSP time, not whole-machine CPU. Reported peaks are held by SC for about one second; this is not a dropout detector. Gaps indicate missing replies.</p><script type="module" src="/panel.js"></script></body></html>
