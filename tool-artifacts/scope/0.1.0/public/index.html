<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scope</title><link rel="stylesheet" href="/scope.css"></head>
<body><main><header><div><span class="eyebrow">SUPER COLLIDER / BUS SCOPE</span><h1>Scope</h1><p id="routing">Choose a bus range and listen.</p></div><span id="connection">Stopped</span></header>
<form id="busForm" class="bus-controls"><label>Rate<select id="rate"><option value="audio">Audio</option><option value="control">Control</option></select></label><label>First bus<input id="bus" type="number" min="0" max="65535" step="1" value="0" required></label><label>Channels<input id="channelCount" type="number" min="1" max="16" step="1" value="2" required></label><label>View<select id="displayMode"><option value="both">Waves + meters</option><option value="waves">Waves only</option><option value="meters">Meters only</option><option value="wave-opacity">Waves + opacity</option><option value="opacity">Opacity widgets</option></select></label><button id="listen" type="submit">Listen</button><button id="stop" type="button" class="secondary" disabled>Stop</button></form>
<p id="error" role="alert" hidden></p>
<section class="scope-display"><canvas id="scope" aria-label="Selected SuperCollider bus signals"></canvas><div class="scope-ruler"><span id="channels">No active capture</span><span id="duration">—</span></div></section>
<section id="meters" class="meter-bank" aria-label="Live per-bus levels"></section>
<section id="opacityDemo" class="opacity-demo" hidden><div class="opacity-settings"><strong>Channel opacity</strong><label>Size<select id="opacitySize"><option value="all">All sizes</option><option value="24">24 px</option><option value="48">48 px</option><option value="96">96 px</option></select></label><label>Updates<select id="opacityRate"><option value="15">15 Hz</option><option value="8">8 Hz</option></select></label><span id="opacityMapping">Listen to a bus range.</span></div><div id="opacityWidgets" class="opacity-bank" aria-label="Channel-linked opacity examples"></div></section>
<div class="scope-controls"><button id="freeze" disabled>Freeze</button><label class="zoom-control">Y zoom<input id="gain" type="range" min="-4" max="6" step="0.01" value="0" aria-label="Y zoom" title="Double-click to reset to 1×"><output id="gainValue" for="gain">1×</output></label><label class="zoom-control">X zoom<input id="zoom" type="range" min="-4" max="3" step="0.01" value="0" aria-label="X zoom" title="Double-click to reset to 1×"><output id="zoomValue" for="zoom">1×</output></label><span id="level">—</span></div>
<div class="scope-navigation"><span id="startTime">0 ms</span><label for="pan">Position<input id="pan" type="range" min="0" max="100" step="0.1" value="0" disabled></label><span id="endTime">—</span></div>
<div class="trigger-controls"><label>Trigger<select id="triggerMode"><option value="free">Free running</option><option value="rising">Rising edge</option><option value="falling">Falling edge</option></select></label><label>On<select id="triggerChannel"><option value="0">First channel</option></select></label><label class="trigger-level">Level<input id="triggerLevel" type="range" min="-1" max="1" step="0.01" value="0" aria-label="Trigger level"><output id="triggerLevelValue">0.00</output></label><span id="triggerState" role="status">Free running</span></div>
<div class="paint-rate"><label>Trace<select id="traceMode"><option value="connected">Connected</option><option value="stepped">Stepped</option></select></label><label>Refresh<select id="paintRate"><option value="0">Auto</option><option value="30">30 fps</option><option value="15">15 fps</option></select></label></div>
<p id="resolution">Waiting for capture</p><footer><span id="source">Shell SC · no active bus</span><span id="updates">—</span></footer></main><script type="module" src="/scope.js"></script></body></html>
